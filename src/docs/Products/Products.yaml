openapi: 3.0.0
info:
  title: API de Productos
  version: 1.0.0
  description: Documentación de la API para manejar productos.
servers:
  - url: https://entrega-opcional.onrender.com/api/products

paths:
  /all:
    get:
      summary: Obtener todos los productos
      description: Devuelve una lista de todos los productos disponibles.
      security:
        - sessionAuth: []
      responses:
        "200":
          description: Lista de productos
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: number
                    title:
                      type: string
                    description:
                      type: string
                    price:
                      type: number
                    thumbnail:
                      type: string
                      nullable: true
                    code:
                      type: number
                    stock:
                      type: number
                    status:
                      type: boolean
                    category:
                      type: string
                    owner:
                      type: string
                    rol:
                      type: string
        "401":
          description: No autorizado - la sesión no es válida
        "500":
          description: Error del servidor

  /update:
    post:
      summary: Actualizar un producto
      description: Permite a un administrador actualizar la información de un producto.
      security:
        - sessionAuth: []
        - roleAuth: ["admin"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: number
                title:
                  type: string
                description:
                  type: string
                price:
                  type: number
                thumbnail:
                  type: string
                  nullable: true
                code:
                  type: number
                stock:
                  type: number
                status:
                  type: boolean
                category:
                  type: string
                owner:
                  type: string
                rol:
                  type: string
      responses:
        "200":
          description: Producto actualizado exitosamente
        "403":
          description: Acceso denegado - rol no autorizado
        "404":
          description: Producto no encontrado
        "500":
          description: Error del servidor

  /{pid}:
    get:
      summary: Obtener un producto por ID
      description: Devuelve la información de un producto específico utilizando su ID.
      security:
        - sessionAuth: []
      parameters:
        - name: pid
          in: path
          required: true
          description: ID del producto a obtener
          schema:
            type: number
      responses:
        "200":
          description: Producto encontrado
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: number
                  title:
                    type: string
                  description:
                    type: string
                  price:
                    type: number
                  thumbnail:
                    type: string
                    nullable: true
                  code:
                    type: number
                  stock:
                    type: number
                  status:
                    type: boolean
                  category:
                    type: string
                  owner:
                    type: string
                  rol:
                    type: string
        "404":
          description: Producto no encontrado
        "401":
          description: No autorizado - la sesión no es válida
        "500":
          description: Error del servidor

    delete:
      summary: Eliminar un producto
      description: Permite a un administrador o premium eliminar un producto.
      security:
        - sessionAuth: []
        - roleAuth: ["admin", "premium"]
      parameters:
        - name: pid
          in: path
          required: true
          description: ID del producto a eliminar
          schema:
            type: number
      responses:
        "204":
          description: Producto eliminado exitosamente
        "403":
          description: Acceso denegado - rol no autorizado
        "404":
          description: Producto no encontrado
        "500":
          description: Error del servidor

components:
  securitySchemes:
    sessionAuth:
      type: http
      scheme: cookie
      description: Autenticación basada en sesión a través de cookies.
    roleAuth:
      type: apiKey
      in: header
      name: x-role
      description: Verifica que el rol del usuario cumpla con los requerimientos para acceder al endpoint.
